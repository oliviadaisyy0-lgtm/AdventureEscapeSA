

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Package Details</title>
</head>
<body>

  <header class="top-bar">
    <a class="top-bar__back" href="overview.html" aria-label="Back to overview">
      <span aria-hidden="true">&larr;</span> Adventure Escape SA
    </a>
    <div class="top-bar__actions">
      <button type="button" id="save-btn" class="top-bar__btn">Save</button>
      <button type="button" id="share-btn" class="top-bar__btn">Share</button>
    </div>
  </header>
  
  <main class="item">

    <div class="item__main">
      <img id="main-photo" class="item__photo" src="images/mountain adventure.jpg" alt="mountain adventure package photo" width="500" height="300">
      <img id="main-photo" class="item__photo" src="images/mountain 2.jpg" alt="mountain adventure package photo" width="300" height="200">
      <img id="main-photo" class="item__photo" src="images/mountain 3.jpg" alt="mountain adventure package photo" width="300" height="200">
      <img id="main-photo" class="item__photo" src="images/mountain 4.jpg" alt="mountain adventure package photo" width="300" height="200">
      <img id="main-photo" class="item__photo" src="images/mountain 5.jpg" alt="mountain adventure package photo" width="300" height="200">
      <h1 id="item-title" class="item__title">Mountain Adventure Package</h1>
      <p class="item__rating"><span class="item__rating-label">Rating:</span> <span id="item-rating">&#9733;&#9733;&#9733;&#9733;&#9733;</span></p>

      <section class="acc">
        <div class="acc__item" id="acc-description">
          <button type="button" class="acc__head" aria-expanded="true" aria-controls="body-description">
            <span class="acc__title">Description</span><span class="acc__arrow" aria-hidden="true">&darr;</span>
          </button>
          <div class="acc__body" id="body-description"><p id="item-description"></p></div>
        <div class="acc" p> A guide mountain adventure for outdoor enthusiasts"</p>
        </div>

        
      <div class="acc__item" id="acc-included">
     <button type="button" class="acc__head"
    aria-expanded="true" aria-controls="body-included">
    <span class="acc__title">What's Included</span>
    <span class="acc__arrow" aria-hidden="true">&darr;</span>
     </button>

     <div class="acc__body" id="body-included">
    <ul id="item-included">
      <li>Mountain hiking</li>
      <li>Scenic viewpoints</li>
      <li>Rock scrambling</li>
    </ul>
  </div>
   </div>

        <div class="acc__item" id="acc-meeting">
          <button type="button" class="acc__head" aria-expanded="false" aria-controls="body-meeting">
            <span class="acc__title">Meeting Point</span><span class="acc__arrow" aria-hidden="true">&uarr;</span>
          </button>
          <div class="acc__body" id="body-meeting" hidden><p id="item-meeting"></p></div>
        </div>

        <div class="acc__item" id="acc-cancel">
          <button type="button" class="acc__head" aria-expanded="false" aria-controls="body-cancel">
            <span class="acc__title">Cancellation Policy</span><span class="acc__arrow" aria-hidden="true">&uarr;</span>
          </button>
          <div class="acc__body" id="body-cancel" hidden><p id="item-cancel"></p></div>
        </div>
      </section>
    </div>

    <div id="thumbs" class="item__thumbs" aria-label="More photos"></div>

    <aside class="price-card">
      <h2 id="item-price" class="price-card__price">R1500 Per Person</h2>
      <label class="price-card__label" for="book-date">Date:</label>
      <input class="price-card__date" type="date" id="book-date">
      <button type="button" id="book-btn" class="price-card__btn price-card__btn--book">Book Now</button>
      <button type="button" id="quote-btn" class="price-card__btn price-card__btn--quote">Add To Quote</button>
    </aside>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
